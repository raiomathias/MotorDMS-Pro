<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Iniciar sesión · MotorDMS Pro</title><meta name="description" content="Acceso seguro a MotorDMS Pro."><meta name="robots" content="noindex,nofollow">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/dist/umd/supabase.min.js"></script>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;color:#172438;background:#f4f7fb;font-synthesis:none}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 15% 5%,#e3edff 0,transparent 42%),#f4f7fb}button,input{font:inherit}.login{width:min(100%,430px);background:#fff;border:1px solid #e2e8f1;border-radius:20px;padding:clamp(24px,6vw,38px);box-shadow:0 18px 60px #21385c12}.brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:21px;letter-spacing:-.4px}.logo{width:42px;height:42px;border-radius:13px;background:#1768e5;color:#fff;display:grid;place-items:center;font-size:23px}.version{margin-left:auto;color:#8995a8;font-size:10px;font-weight:600;letter-spacing:0}.eyebrow{margin-top:34px;color:#1768e5;font-size:11px;letter-spacing:.13em;font-weight:800}.login h1{font-size:28px;letter-spacing:-.8px;margin:9px 0}.subtitle{color:#718096;font-size:14px;line-height:1.6;margin:0 0 24px}.form{display:grid;gap:17px}.form label{display:grid;gap:8px;font-size:13px;font-weight:700}.form input{width:100%;min-height:46px;border:1px solid #d8e0eb;border-radius:10px;padding:12px;color:#172438;background:#fff;outline:none}.form input:focus{border-color:#1768e5;box-shadow:0 0 0 3px #1768e51a}.primary{margin-top:3px;width:100%;min-height:47px;border:0;border-radius:10px;background:#1768e5;color:#fff;font-weight:750}.primary:disabled{opacity:.6;cursor:wait}.message{display:none;padding:11px 12px;border-radius:9px;background:#fff0f0;color:#b42318;font-size:13px;line-height:1.45;margin-bottom:16px}.message.show{display:block}.security{margin:20px 0 0;text-align:center;color:#8a96a8;font-size:11px;line-height:1.6}@media(max-width:420px){body{padding:14px}.login{border-radius:16px;padding:24px}.login h1{font-size:25px}}
</style></head><body><main class="login"><div class="brand"><span class="logo">M</span><span>MotorDMS <span style="color:#1768e5">Pro</span></span><span class="version" id="versionStatus">v0.5</span></div><div class="eyebrow">ACCESO PRIVADO</div><h1>Inicia sesión</h1><p class="subtitle">Ingresa con tu nombre y apellido y la contraseña asignada por el administrador.</p><div id="message" class="message" role="status" aria-live="polite"></div><form class="form" id="authForm"><label>Nombre y apellido<input name="loginName" required autocomplete="username" placeholder="Ej. Mathias Michell" maxlength="120"></label><label>Contraseña<input name="password" type="password" required autocomplete="current-password" placeholder="Tu contraseña"></label><button id="authSubmit" class="primary" type="submit">Ingresar</button></form><p class="security">Acceso exclusivo para usuarios autorizados. Las cuentas son creadas por el administrador.</p></main>
<script>
'use strict';const CONFIG={url:'https://ctillqsactkhwgxhfnoq.supabase.co',key:'sb_publishable_z9vUc4Dd63xZfrs0_vtBdw_TJhI0l9d'};const client=window.supabase.createClient(CONFIG.url,CONFIG.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const $=id=>document.getElementById(id);
function normalizeLogin(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim().replace(/[^a-z0-9]+/g,'.').replace(/^\.+|\.+$/g,'')}
function msg(t){$('message').textContent=t;$('message').className='message show'}
const destination=new URL('vistaprincipal/',document.baseURI);if(new URLSearchParams(location.search).get('error')==='session')msg('No se pudo verificar la sesión. Intenta iniciar sesión nuevamente.');
client.auth.getSession().then(({data,error})=>{if(!error&&data.session)location.replace(destination.href)}).catch(()=>{});
$('authForm').addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.currentTarget),login=normalizeLogin(f.get('loginName')),password=String(f.get('password')||'');if(login.split('.').filter(Boolean).length<2){msg('Ingresa nombre y apellido.');return}const btn=$('authSubmit');btn.disabled=true;btn.textContent='Ingresando…';$('message').className='message';try{const {data,error}=await client.auth.signInWithPassword({email:login+'@users.autogest.local',password});if(error||!data.session)throw new Error('Nombre, apellido o contraseña incorrectos.');location.replace(destination.href)}catch(err){msg(err.message||'No se pudo iniciar sesión.')}finally{btn.disabled=false;btn.textContent='Ingresar'}});
</script><script src="keyboard.js" defer></script></body></html>
